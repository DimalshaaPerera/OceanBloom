<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OceanBloom - Play</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%A0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="siteHeader" class="nav"></header>

  <main>
    <section id="gamePanel">
      <canvas id="ocean" width="900" height="420" aria-label="Your fish in the ocean"></canvas>

      <div id="hud" class="panel">
        <div>
          <strong id="hudLevel">Level 1 / 6</strong><br>
          <small id="hudStep">Question 1 of 3</small>
        </div>
        <div class="bar" title="Progress through this level"><div id="progressFill"></div></div>
        <div>Score: <strong id="hudScore">0</strong></div>
        <div>Mistakes: <strong id="hudMistakes">0</strong></div>
        <button id="pauseBtn" type="button" class="secondary small pause-btn"
                aria-pressed="false" title="Pause the game (P)">&#10074;&#10074; Pause</button>
      </div>

      <div id="questionBox" class="panel">
        <div id="timerBox" class="timerRow">
          <div class="bar timer"><div id="timerFill"></div></div>
          <strong id="timerText"></strong>
        </div>

        <p id="loadingText">Loading a question...</p>
        <p id="questionText" class="question"></p>

        <!-- ocean quiz: answer buttons are created by ui.js -->
        <div id="choices"></div>

        <!-- Shark attack challenge: picture from the Fish Game web service -->
        <img id="puzzle" alt="Picture containing fish and a treasure chest - count the fish" hidden>
        <form id="answerForm" autocomplete="off" hidden>
          <label for="answer">Fish left after the shark attack</label>
          <div class="row">
            <input id="answer" type="number" min="0" step="1" disabled>
            <button id="checkBtn" type="submit" disabled>Check answer</button>
          </div>
        </form>

        <p id="feedback" class="msg" role="status"></p>
        <button id="retryBtn" type="button" hidden>Try again</button>

        <!-- covers the question while paused, so the clock cannot be beaten by pausing -->
        <div id="pauseOverlay" class="pause-overlay" role="dialog" aria-labelledby="pauseTitle" hidden>
          <h2 id="pauseTitle">Paused</h2>
          <p>The clock is stopped and your fish is waiting. The question is hidden until you come back.</p>
          <button id="resumeBtn" type="button">&#9654; Resume</button>
          <small>Tip: press <kbd>P</kbd> or <kbd>Esc</kbd> to pause and resume.</small>
        </div>
      </div>
    </section>

    <section id="endPanel" class="panel" hidden>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="row">
        <button id="playAgainBtn" type="button">Play again</button>
        <a class="button secondary" href="leaderboard.html">Leaderboard</a>
        <a class="button secondary" href="dashboard.html">Dashboard</a>
      </div>
    </section>
  </main>

  <!-- Plain scripts (no build tools). Order matters: each file only uses the ones above it. -->
  <script src="js/events.js"></script>
  <script src="js/api.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/game.js"></script>
  <script src="js/creatures.js"></script>
  <script src="js/ocean.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
